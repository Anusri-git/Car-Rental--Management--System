<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Car Rental Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Automotive CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-car-front-fill brand-red"></i> APEX <span class="brand-red">DRIVE</span>
            </a>
            <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
                <i class="bi bi-list fs-2"></i>
            </button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav ms-auto align-items-lg-center" id="navbar-auth-links">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="cars.html">Available Cars</a></li>
                    <li class="nav-item ms-lg-2"><a class="btn-outline-custom" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- REGISTER MAIN -->
    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 520px;">
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="bi bi-person-badge"></i>
                </div>
                <h2 class="auth-title">Create Account</h2>
                <p class="auth-subtitle">Join Apex Drive and unlock premium car rentals</p>
            </div>

            <div id="alert-container"></div>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="name" placeholder="John Anderson" required minlength="2" maxlength="50">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="john@example.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-telephone"></i></span>
                        <input type="tel" class="form-control" id="phone" placeholder="+1-555-014-8832" required minlength="10" maxlength="15">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Create Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="At least 6 characters" required minlength="6">
                    </div>
                    <small class="text-secondary">Password will be securely hashed with BCrypt.</small>
                </div>

                <button type="submit" class="btn-red w-100 py-2 mb-3" id="submitBtn">
                    <i class="bi bi-check2-circle me-1"></i> Register Account
                </button>
            </form>

            <div class="text-center text-secondary">
                Already registered? <a href="login.html" class="text-danger fw-bold text-decoration-none">Sign In Here</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const password = document.getElementById('password').value;
                const submitBtn = document.getElementById('submitBtn');

                if (password.length < 6) {
                    showAlert('Password must contain at least 6 characters.');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

                try {
                    const res = await fetch(`${API_BASE}/auth/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, phone, password })
                    });
                    const result = await res.json();

                    if (result.success && result.data) {
                        showAlert('Registration successful! Redirecting to dashboard...', 'success');
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1000);
                    } else {
                        showAlert(result.message || 'Registration failed');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Register Account';
                    }
                } catch (err) {
                    console.error(err);
                    showAlert('Network error occurred. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Register Account';
                }
            });
        });
    </script>
</body>
</html>
