spring.application.name=CarRentalManagementSystem
server.port=8080

# Default MySQL DataSource Configuration using Environment Variables
spring.datasource.url=jdbc:mysql://localhost:3306/carrental_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Activate local profile for local credentials if not overridden
spring.profiles.active=local

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Static files handling
spring.web.resources.static-locations=classpath:/static/
